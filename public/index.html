<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Viajes</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Bitacora</p>
      <h1>Viajes</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <header>
        <div><p class="eyebrow"><strong id="count">0</strong> lugares</p><h1>Viajes</h1></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <form id="trip-form" class="card form">
        <input type="hidden" id="trip-id" />
        <input id="day" type="date" required />
        <input id="place" placeholder="Lugar" maxlength="80" required />
        <textarea id="notes" placeholder="Notas" maxlength="1000"></textarea>
        <button class="primary" type="submit">Guardar</button>
        <button id="cancel" class="ghost hidden" type="button">Cancelar</button>
      </form>
      <p id="form-error" class="error" hidden></p>
      <input id="search" type="search" placeholder="Buscar lugar o nota" />
      <ul id="list"></ul>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
